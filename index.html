<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track your job applications, interviews, and rejections in one place."
    />
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
 
    <div class="top-bar"></div>

    <div class="container">
   
      <h1 class="main-title">Job Application Tracker</h1>
   
      <div class="dashboard">
        <div class="stat-card">
          <p class="stat-label">Total</p>
          <p class="stat-value" id="total-count">8</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Interview</p>
          <p class="stat-value interview-count" id="interview-count">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Rejected</p>
          <p class="stat-value rejected-count" id="rejected-count">0</p>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section-header">
        <h2 class="section-title">Available Jobs</h2>
        <span class="jobs-count" id="jobs-count">8 Jobs</span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-all" data-tab="all">All</button>
        <button class="tab-btn" id="tab-interview" data-tab="interview">
          Interview
        </button>
        <button class="tab-btn" id="tab-rejected" data-tab="rejected">
          Rejected
        </button>
      </div>

      <div class="jobs-container" id="jobs-container">

      </div>

      <div class="empty-state hidden" id="empty-state">
        <img src="jobs.png" alt="No jobs" class="empty-icon" />
        <h3 class="empty-title">No jobs available</h3>
        <p class="empty-subtitle">
          Check back soon for new job opportunities
        </p>
      </div>
    </div>


  </body>
</html>
